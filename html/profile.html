<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/profile.css">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Profile</title>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <form action="" id="profile-form">
                <div class="profileIcon" >
                    <i class="fa-solid fa-circle-user fa-flip fa-2xl" style="color: #73fcc1;"></i>
                 </div>
    
                <div class="inpDiv" id="username">
                    <i class="fa-solid fa-user  fa-lg icon"></i>
                    <input type="text" name="" id="username">
                </div>
    
                <div class="inpDiv" id="phnopf">
                    <i class="fa-solid fa-square-phone  fa-lg icon "></i>
                    <input type="number" name="" id="phnoProfile">
                </div>
    
                <div class="inpDiv" id="emailpf">
                    <i class="fa-solid fa-envelope  fa-lg icon"></i>
                    <input type="email" name="" id="emailProfile">
                </div>
    
                <div class="inpDiv genderPos" id="genderpf" >
                        <i class="fa-solid fa-venus-mars  fa-lg icon"></i>
                        
                        <input type="radio" name="gender" id="genderProfile"> <label for="">Male</label>
                        <input type="radio" name="gender" id="genderProfile"> <label for="">Female</label>
                        <input type="radio" name="gender" id="genderProfile"> <label for="">Others</label>
                </div>
    
                <div class="inpDiv" id="addresspf">
                    <i class="fa-solid fa-location-dot fa-lg icon"></i>
                    <input type="text" name="" id="addressProfile">
                </div>
    
                <div class="inpDiv" id="pinpf">
                    <i class="fa-solid fa-map-pin fa-lg icon"></i>
                    <input type="number" name="" id="pinProfile">
                </div>
    
                <div class="update inpDiv">
                    <input type="submit" value="Update">
                </div>
            </form>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script> 
    <script src="../js/script.js"></script>
    <script src="../js/formModule.js"></script>
    <script src="../js/tableModule.js"></script>
    <script src="../js/validationModule.js"></script>
    <script src="../js/pageModule.js"></script>
</body>
</html>
